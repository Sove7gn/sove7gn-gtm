<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SOVE7GN CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* SOVE7GN CRM v2 (16 Nov): white, flat, one sidebar. Layout after Drona's CRM: quiet left rail, centred column of bordered cards. */
:root{
  --bg:#FFFFFF; --rail:#FAFAFB; --sunk:#F5F5F7; --hover:#F0F1F4; --line:#E7E8EC; --line-2:#D9DBE1;
  --fg:#17181C; --muted:#656A74; --faint:#9A9EA7;
  --accent:#2D6BEA; --accent-soft:#EEF3FE;
  --ok:#1F8A4C; --ok-soft:#E5F5EB; --warn:#A86200; --warn-soft:#FDF1DE; --bad:#C2392F; --bad-soft:#FCE7E4;
  --li:#0A66C2; --li-soft:#E8F1FB; --x:#111111; --x-soft:#EEEFF1; --ig:#C13584; --ig-soft:#FCEAF4; --wa:#1DA851; --wa-soft:#E3F6EA;
  --r:12px; --r-sm:8px;
  --f:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  /* names the shared page logic uses in colours it hands back */
  --ink:var(--fg); --ink-2:#3C3F46; --ink-3:var(--muted); --ink-4:var(--faint); --hairline:var(--line); --hairline-strong:var(--line-2);
  --n-soft:var(--sunk); --n-soft-2:var(--hover); --ok-ink:var(--ok); --warn-ink:var(--warn); --bad-ink:var(--bad);
  --in:#2F8F5B; --out:#3B6FD8; --mid:#7A4FD0; --in-soft:#E7F5EE; --out-soft:#EDF2FD; --mid-soft:#F2EDFC;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:600;letter-spacing:-.01em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:var(--fg);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.nav{flex:1;overflow:auto;padding:4px 10px 12px}
.nav .grp{font-size:11.5px;color:var(--faint);padding:14px 10px 4px;display:flex;justify-content:space-between;gap:6px}
.nav .grp small{font-size:11px;color:var(--faint);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 10px;border-radius:8px;text-align:left;color:var(--ink-2);font-size:13.5px}
.nav button:hover{background:var(--hover)}
.nav button.on{background:#fff;color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.nav button .ic{width:16px;text-align:center;color:var(--faint);font-size:13px}
.nav button.on .ic{color:var(--fg)}
.nav button .badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--fg);color:#fff;border-radius:20px;padding:1px 7px}
.nav button .soon{margin-left:auto;font-size:10.5px;color:var(--faint)}
.rail-foot{border-top:1px solid var(--line);padding:10px;display:grid;gap:2px}
.rail-foot button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:13px;text-align:left}
.rail-foot button:hover{background:var(--hover);color:var(--fg)}
.rail-foot kbd{margin-left:auto;font:11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:#fff}
.main{overflow:auto;min-width:0}
.col{max-width:1080px;margin:0 auto;padding:28px 32px 80px}
.top{display:none}

/* ---------- page head ---------- */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.ph h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph .sp{flex:1}
.ph .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

/* ---------- cards, sections ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.card+.card,.sec+.sec{margin-top:16px}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sec-h h2{margin:0;font-size:14.5px;font-weight:600}
.sec-h .n{font-size:12px;color:var(--muted);background:var(--sunk);border-radius:20px;padding:1px 8px}
.sec-h .hint{color:var(--muted);font-size:12.5px}
.sec-h .sp{flex:1}
.sec-b{padding:14px 16px}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0;padding:12px 16px 6px;display:flex;align-items:center;gap:8px}
.sub-h .sp{flex:1}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:13px}
.note{font-size:12.5px;color:var(--muted)}
.warnline{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px}
.errline{font-size:12.5px;color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:8px 10px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.stat{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.stats.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:860px){.stats.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted);margin-top:2px}
.stat .bar{height:4px;background:var(--sunk);border-radius:4px;margin-top:8px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--fg);border-radius:4px}
.stat.good .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}

/* tables */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--rail)}
table.t td{padding:8px 16px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.zero{color:var(--faint)}
table.t tr.grp td{background:var(--rail);font-weight:600;font-size:12px;color:var(--ink-2)}

/* rows (people, items) */
.rows{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.rows>.item:first-child{border-top:0}
.item:hover{background:#FCFCFD}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:600;position:relative;flex:none}
.av .plat{position:absolute;right:-4px;bottom:-4px;transform:scale(.82)}
.item .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .nm{font-weight:600;cursor:pointer}
.item .nm:hover{text-decoration:underline}
.item .meta{color:var(--muted);font-size:12.5px}
.item .line{margin-top:4px;font-size:13px;color:var(--ink-2)}
.item .quote{margin-top:6px;font-size:13px;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:10px;white-space:pre-wrap}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.item .body{min-width:0}
.item .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item textarea{margin-top:8px}
.item .under{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}

/* pills, chips, platform marks */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;border-radius:20px;padding:1px 8px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)} .pill.line{background:#fff;box-shadow:inset 0 0 0 1px var(--line-2)}
.pill.great{background:var(--ok-soft);color:var(--ok)} .pill.good{background:var(--accent-soft);color:var(--accent)} .pill.maybe{background:var(--warn-soft);color:var(--warn)} .pill.weak{background:var(--sunk);color:var(--muted)}
.plat{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;flex:none;line-height:1}
.plat.li{background:var(--li)} .plat.x{background:var(--x)} .plat.ig{background:var(--ig)} .plat.em{background:#6B7280} .plat.wa{background:var(--wa)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font-size:12.5px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--fg);border-color:var(--fg);color:#fff}
.chip .c{font-size:11px;opacity:.7}

/* buttons, fields */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--fg);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--fg);border-color:var(--fg);color:#fff}
.btn.pri:hover{background:#2B2D33}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--fg)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line-2);border-radius:8px;background:#fff;padding:7px 10px;font-size:13px;outline:none}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--fg);box-shadow:0 0 0 3px rgba(23,24,28,.06)}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.count{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}

/* jump bar on Needs you */
.jump{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.jump a{text-decoration:none}

/* health lines */
.hl{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-top:0}
.pipe{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pipe .st{border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12.5px;color:var(--ink-2);background:#fff}
.pipe .st b{font-weight:600;color:var(--fg);margin-left:4px}

/* placeholder for pages coming in later phases */
.soonbox{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.soonbox h2{color:var(--fg);font-size:16px;margin:0 0 6px}
.soonbox .chips{justify-content:center;margin-top:14px}

/* ---------- person panel ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,22,28,.28);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:#fff;border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.08)}
.panel .p-h{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.panel .p-top{display:flex;gap:12px;align-items:flex-start}
.panel .p-top .av{width:42px;height:42px;font-size:14px}
.panel h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.panel .p-sub{color:var(--muted);font-size:13px;margin-top:2px}
.panel .p-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.panel .p-close{margin-left:auto;border:0;background:none;font-size:20px;color:var(--muted);width:32px;height:32px;border-radius:8px}
.panel .p-close:hover{background:var(--hover)}
.chan{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.chan .c{border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.chan .c .t{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.chan .c .s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.chan .c button{margin-top:6px}
.chan .c.off{background:var(--rail)}
.track{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
.track button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:2px 9px;font-size:11.5px;color:var(--muted)}
.track button.on{background:var(--fg);border-color:var(--fg);color:#fff}
.track button.past{color:var(--fg)}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.p-b{flex:1;overflow:auto;padding:16px 20px 40px}
.blk{margin-bottom:18px}
.blk>h3{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.blk>h3 .sp{flex:1}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;align-items:center;font-size:13px}
.kv label{color:var(--muted);font-size:12.5px}
.pmsg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.pmsg .mh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;margin-bottom:4px}
.pmsg .mt{white-space:pre-wrap;font-size:13px;color:var(--ink-2)}
.ev{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ev:first-child{border-top:0}
.ev .i{color:var(--muted);text-align:center}
.ev .w{color:var(--faint);font-size:12px}
.pre{white-space:pre-wrap;font-size:13px;line-height:1.5;color:var(--ink-2)}

/* ---------- search, toast, modal ---------- */
.pal{position:fixed;inset:0;z-index:60;background:rgba(20,22,28,.28);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal .box{width:min(560px,92vw);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.18);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;outline:none}
.pal .res{max-height:52vh;overflow:auto;padding:6px}
.pal .r{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left}
.pal .r:hover,.pal .r.on{background:var(--hover)}
.pal .r .k{margin-left:auto;font-size:11.5px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;z-index:70;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:min(560px,92vw)}
.toast.err{background:var(--bad)}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,22,28,.28);display:flex;justify-content:center;align-items:flex-start;padding:6vh 16px;overflow:auto}
.modal .box{width:min(760px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:16px}
.modal .mb{padding:16px 18px}
.dry{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:80;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:600;border-radius:20px;padding:3px 12px;border:1px solid #F1D9AE}

/* ---------- phone ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .rail{display:none;position:fixed;inset:0 20% 0 0;z-index:45;box-shadow:12px 0 40px rgba(0,0,0,.12)}
  .rail.open{display:flex}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fff}
  .top b{font-weight:600}
  .top .sp{flex:1}
  .col{padding:18px 16px 60px}
  .grid2{grid-template-columns:1fr}
  .item{grid-template-columns:34px minmax(0,1fr)}
  .item .acts{grid-column:1 / -1;justify-content:flex-start}
  .ph{flex-direction:column;gap:8px}
  .ph .right{justify-content:flex-start}
  .kv{grid-template-columns:1fr}
  .sec-h .hint{display:none}
}

/* ---------- v2 phase 2+3 (16 Nov): one clean row style everywhere ---------- */
.ph{margin-bottom:18px}
.h2{font-size:15px;font-weight:600;margin:28px 0 10px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.in.search{width:220px;height:32px;padding:5px 10px}
.seg{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.seg button{white-space:nowrap;flex:none;border:0;background:none;padding:9px 12px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.seg button.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:500}
.seg .c{font-size:11.5px;background:var(--sunk);border-radius:20px;padding:0 7px;color:var(--muted)}
.seg button.on .c{background:var(--fg);color:#fff}
.tb{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.tb-h,.tb-r{display:grid;gap:14px;align-items:center;padding:0 16px}
.tb-h{height:36px;background:var(--rail);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:500}
.tb-r{min-height:58px;padding-top:8px;padding-bottom:8px;border-top:1px solid var(--line)}
.tb-h+.tb-r{border-top:0}
.tb-r[data-a]{cursor:pointer}
.tb-r:hover{background:#FAFAFB}
.tc{min-width:0}
.tb-more{padding:8px 12px;border-top:1px solid var(--line)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.faint{color:var(--faint)}
.pc{display:flex;gap:10px;align-items:center;min-width:0}
.pc-t{min-width:0}
.pc .nm{font-weight:600}
.ra{display:flex;gap:6px;justify-content:flex-end;align-items:center;flex-wrap:nowrap}
.todo-w{font-weight:500}
.todo3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.t3{text-align:left;border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px}
.t3:hover{border-color:var(--line-2);background:#FAFAFB}
.t3 .n{font-size:26px;font-weight:600;letter-spacing:-.02em}
.t3 .l{font-weight:600;margin-top:2px}
.t3 .d{font-size:12.5px;color:var(--muted)}
.t3.zero .n{color:var(--faint)}
.goal{display:flex;align-items:center;gap:10px;font-size:13px}
.bar1{width:120px;height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar1 i{display:block;height:100%;background:var(--fg)}
.posts{display:grid;gap:12px}

<script>
/* GTM intelligence (8 Nov): the ICP as one definition, evidence-based ICP scoring, relationship classification
   (New / Outbound / Midbound / Inbound), acquisition source and engagement status, the Buying Window Radar, outreach drafts,
   dedupe and outreach analytics. Pure functions: no DOM, no Supabase. Inlined into the page as window.GTM by build_app.py
   and loaded by scripts/test-gtm.mjs.

   Everything a lead knows lives in lead.fields.gtm (no schema change):
     intel:   {key: {v, src, at, by}}    facts; src is the URL it came from, at the day it was last checked
     signals: [{id, type, text, at, seen, src, kind}]   buying signals; kind 'fact' needs a src, else 'inference'
     icp:     {ov: {dim: {pts, why}}, dq: 'reason'}      manual overrides and disqualification
     rel:     {acq, conn}                acquisition source override; LinkedIn connection: connected / pending / none
     touches: [{id, at, dir, ch, type, text, tpl, angle}] outreach and replies, newest last
     opp:     {why, angle, hook, msg}    our own notes on the opportunity (not facts)
   Unknown is never scored as positive: a dimension with no evidence scores 0 and is shown as Unknown. */
(function(root){
'use strict';
const DAY=864e5;
const clip=(s,n)=>{s=String(s==null?'':s);return s.length>n?s.slice(0,n-1).trimEnd()+'…':s;};
const low=s=>String(s==null?'':s).toLowerCase();
const has=v=>v!=null&&String(v).trim()!=='';
const iso=d=>{const x=new Date(d);return isNaN(x)?'':x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};

/* ---------- the ICP: one definition, editable on Setup (setting "icp"), defaults from the user's spec ---------- */
const ICP_DEFAULT={
  summary:'Funded B2B / B2B2C software, SaaS, AI or deep-tech startups (5–50 people, seed to Series C, raised in the last 6 months) where a founder or C-suite leader owns the growth budget, GTM is still founder-led, there is no Head of Marketing or SDR team, and LinkedIn / X presence is weak. Must be able to afford about $20k a month.',
  models:['B2B','B2B2C'],
  industries:['software','saas','ai','artificial intelligence','machine learning','ml','deep tech','deeptech','devtools','developer','infrastructure','api','data','security','fintech','hardware','biotech','climate'],
  empMin:5,empMax:50,
  stages:['Seed','Series A','Series B','Series C'],
  recencyMonths:6,
  budgetMonth:20000,
  minRaise:2000000,     // raised at least this much (last round or total): affords ~$20k a month
  accelerators:['YC','Y Combinator','Techstars','Antler','Entrepreneur First','500 Global','a16z speedrun','Neo','South Park Commons','Sequoia Arc','HF0','Pear'],
  titles:['founder','co-founder','cofounder','ceo','chief','cto','coo','cmo','cgo','cro','cpo','president','managing director'],
  references:[],        // lookalike profiles (from crm/config.json icp.references)
  weights:{authority:15,industry:10,employees:10,stage:10,recency:15,founder_led:10,no_team:10,growth:10,organic_gap:5,afford:5},
  bands:{high:85,strong:70,research:50},
};
const DIMS=[
  ['authority','Decision-maker authority'],['industry','Industry'],['employees','Employee count'],['stage','Funding stage'],['recency','Funding recency'],
  ['founder_led','Founder-led GTM'],['no_team','No marketing / SDR team'],['growth','Growth signals'],['organic_gap','Organic distribution gap'],['afford','Affordability'],
];
function icpConfig(saved,cfg){
  const base={...ICP_DEFAULT,...((cfg&&cfg.icp)||{})};const s=saved&&typeof saved==='object'?saved:{};
  const out={...base,...s,weights:{...base.weights,...(s.weights||{})},bands:{...base.bands,...(s.bands||{})}};
  if(!Array.isArray(out.references)||!out.references.length)out.references=base.references||[];
  return out;
}

/* ---------- the intelligence card: what we track, grouped ---------- */
const INTEL=[
  {g:'company',label:'Company',fields:[['website','Website','url'],['industry','Industry','text'],['model','Business model','select',['B2B','B2B2C','B2C','Marketplace','Services / agency']],
    ['employees','Employees','int'],['hq','HQ','text'],['company_li','Company LinkedIn','url'],['description','What they do','area'],['accelerator','Accelerator','text']]},
  {g:'funding',label:'Funding',fields:[['round','Latest round','select',['Pre-seed','Seed','Series A','Series B','Series C','Series D+','Bootstrapped','Grant / other']],
    ['amount','Round amount (USD)','money'],['date','Round date','date'],['investors','Lead investors','text'],['total','Total raised (USD)','money']]},
  {g:'person',label:'Decision-maker',fields:[['title','Title','text'],['authority','Authority','select',['Founder / CEO','C-suite','VP / Head of','Manager','Individual contributor']],
    ['founder','Founder','select',['Yes','No']],['prev','Previous companies','text']]},
  {g:'gtm',label:'GTM',fields:[['founder_led','Founder-led GTM','select',['Yes','No']],['hom','Head of Marketing','select',['No','Yes']],['sdr','SDR team','select',['None','1–2','3+']],
    ['mkt_size','Marketing team size','int'],['hiring','GTM hiring (roles open)','text'],['jobs','Job posts','url'],['li_freq','Founder LinkedIn posts / month','num'],
    ['x_freq','Founder X posts / month','num'],['followers','Founder followers (LinkedIn)','int']]},
];
const FIELD=Object.fromEntries(INTEL.flatMap(g=>g.fields.map(f=>[f[0],{key:f[0],label:f[1],type:f[2],opts:f[3]||null,g:g.g}])));
const SIGNALS={raise:'Recent raise',hiring:'GTM hiring',founder_post:'Founder posting about acquisition',launch:'Launch',expansion:'Expansion',mkt_gap:'No marketing team',weak_organic:'Weak organic presence',other:'Other'};
const TOUCH_TYPES={connection:'Connection request',dm:'Direct message',followup:'Follow-up',email:'Email',accepted:'Accepted connection',comment:'Commented on their post',comment_reply:'Replied to our comment',post_engaged:'Engaged with our post',reply:'Reply',question:'Question',interest:'Showed interest',meeting:'Meeting booked',not_interested:'Not interested',other:'Other'};
const OUT_TYPES=['connection','dm','followup','email','comment'];
// These make an outbound lead Midbound (we reached out first, then they engaged); accepting a connection does not.
const QUALIFYING=['reply','question','interest','meeting','comment_reply','post_engaged'];
// Of those, the ones that are a real conversation and move the stage forward (a like on our post doesn't).
const STAGE_MOVERS=['reply','question','interest','meeting','comment_reply'];
const POSITIVE=['interest','meeting'];

// Money as people write it: "$17M", "17.0m", "2.5 million", "500k", "1,200,000".
function parseMoney(v){
  if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;
  const m=String(v).replace(/,/g,'').match(/\$?\s*(\d+(?:\.\d+)?)\s*(k|m|mn|million|b|bn|billion)?\b/i);if(!m)return null;
  const n=parseFloat(m[1]),u=low(m[2]||'');return Math.round(n*(u==='k'?1e3:/^m/.test(u)?1e6:/^b/.test(u)?1e9:1));
}
const fmtMoney=n=>n==null?'':n>=1e9?'$'+(n/1e9).toFixed(n%1e9?1:0)+'B':n>=1e6?'$'+(n/1e6).toFixed(n%1e6?1:0)+'M':n>=1e3?'$'+Math.round(n/1e3)+'k':'$'+n;
// "2026-09", "2026-09-14", "Sep 2026" → a Date (first of the month when only the month is known).
function parseDay(v){
  if(!has(v))return null;const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/);
  if(m){const d=new Date(+m[1],+m[2]-1,+(m[3]||1));return isNaN(d)?null:d;}
  m=s.match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{4})$/);if(m){const i=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(low(m[1]));if(i>=0)return new Date(+m[2],i,1);}
  const d=new Date(s);return isNaN(d)?null:d;
}
const isUrl=s=>/^https?:\/\/[^\s/$.?#].[^\s]*$/i.test(String(s||'').trim());
// Checks one intel value before it is saved. Returns '' when fine, else what's wrong.
function validateIntel(key,val,src,at,now){
  const f=FIELD[key];if(!f)return 'Unknown field '+key;now=now||new Date();
  if(has(val)){
    if(f.type==='url'&&!isUrl(val))return f.label+' must be a link starting with http:// or https://';
    if((f.type==='int'||f.type==='num')&&!(isFinite(Number(val))&&Number(val)>=0))return f.label+' must be a number';
    if(f.type==='money'&&parseMoney(val)==null)return f.label+' must be an amount, e.g. $2.5M';
    if(f.type==='date'){const d=parseDay(val);if(!d)return f.label+' must be a date, e.g. 2026-09 or 2026-09-14';if(d-now>DAY)return f.label+' can’t be in the future';}
    if(f.type==='select'&&f.opts&&!f.opts.includes(val))return f.label+' must be one of: '+f.opts.join(', ');
  }
  if(has(src)&&!isUrl(src))return 'The source must be a link starting with http:// or https://';
  if(has(at)){const d=parseDay(at);if(!d)return 'Last verified must be a date';if(d-now>DAY)return 'Last verified can’t be in the future';}
  return '';
}

/* ---------- LinkedIn URLs and dedupe ---------- */
function normLi(u){
  let s=String(u||'').trim();if(!s)return '';try{s=decodeURIComponent(s);}catch(e){}
  s=s.toLowerCase().replace(/[?#].*$/,'').replace(/^https?:\/\//,'').replace(/^(www\.|[a-z]{2}\.)?linkedin\.com/,'linkedin.com').replace(/\/+$/,'');
  return /linkedin\.com\/(in|company)\//.test(s)?s:'';
}
const normName=s=>low(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const normCo=s=>normName(String(s||'').replace(/\(.*?\)/g,'')).replace(/\b(inc|llc|ltd|labs|technologies|technology|ai|hq|co|corp|the)\b/g,'').replace(/\s+/g,' ').trim();
// Possible duplicates among live (not archived) leads: same LinkedIn profile first, then same email, then same person at the same company.
function dupes(rows){
  const live=(rows||[]).filter(l=>!l.archived);const out=[];const used=new Set();
  const pass=(why,keyOf)=>{const m=new Map();for(const l of live){if(used.has(l.id))continue;const k=keyOf(l);if(!k)continue;(m.get(k)||m.set(k,[]).get(k)).push(l);}
    for(const [k,list] of m)if(list.length>1){list.forEach(l=>used.add(l.id));out.push({key:why+':'+k,why,ids:list.map(l=>l.id)});}};
  pass('Same LinkedIn profile',l=>normLi(l.linkedin));
  pass('Same email',l=>{const e=low(l.email).trim();return /@/.test(e)?e:'';});
  pass('Same name and company',l=>{const n=normName(l.name),c=normCo(l.company);return n&&c?n+'|'+c:'';});
  return out;
}
// The lead a new record would duplicate, if any (LinkedIn first, then email, then name + company).
function findDup(rows,o){
  const live=(rows||[]).filter(l=>!l.archived);const li=normLi(o.linkedin),em=low(o.email).trim(),n=normName(o.name),c=normCo(o.company);
  return (li&&live.find(l=>normLi(l.linkedin)===li))||(/@/.test(em)&&live.find(l=>low(l.email).trim()===em))||(n&&c&&live.find(l=>normName(l.name)===n&&normCo(l.company)===c))||null;
}

/* ---------- evidence: what we know, from the card first, else read off the CRM record itself ---------- */
const gtmOf=l=>{const g=l&&l.fields&&l.fields.gtm;return g&&typeof g==='object'?g:{};};
// YC batches: W = winter (Jan), X = spring (Apr), S = summer (Jun), F = fall (Sep). Unknown letters give no date.
const BATCH_M={w:0,x:3,s:5,f:8};
function ycBatch(text){const m=String(text||'').match(/\b(?:YC|Y\s?Combinator)\s*[('’]?\s*([WSFXP])\s?'?(\d{2})\b/i);
  if(!m)return null;const L=low(m[1]),y=2000+Number(m[2]);return{label:'YC '+m[1].toUpperCase()+m[2],date:BATCH_M[L]!=null?new Date(y,BATCH_M[L],1):null};}
// One evidence item: {v, src, at, kind}. kind: 'fact' (has a source link), 'manual' (entered, no link), 'derived' (read off the
// CRM record: role, notes, group, which came from the lead sheet or LinkedIn headline), 'inference' (an AI guess or a rule of thumb).
function evidence(l){
  const g=gtmOf(l);const I=g.intel||{};const E={};
  for(const k in I){const x=I[k];if(x&&has(x.v))E[k]={v:x.v,src:x.src||'',at:x.at||'',kind:isUrl(x.src)?'fact':'manual'};}
  const notes=String(l.notes||''),role=String(l.role||''),all=[notes,role,l.group_name,l.company,l.source_detail].join('\n');
  const put=(k,v,kind,why)=>{if(!E[k]&&has(v))E[k]={v,src:'',at:'',kind,why};};
  put('title',role,'derived','CRM role (LinkedIn headline)');
  const yc=ycBatch(all);
  if(yc)put('accelerator',yc.label,'derived','CRM notes');else if(/\bYC founders\b/i.test(l.group_name||''))put('accelerator','YC','derived','CRM group');
  const r=notes.match(/\b(pre-?seed|seed|series\s+[a-e])\b[^\n$]{0,12}(\$\s*[\d.,]+\s*(?:k|m|mn|million|b|bn)?)?/i);
  if(r){const round=/pre/i.test(r[1])?'Pre-seed':/^seed/i.test(r[1])?'Seed':'Series '+r[1].slice(-1).toUpperCase();
    const ai=/^stage:/im.test(notes)&&/stage:\s*(pre-?seed|seed|series)/i.test(notes);   // social-sync's AI read: "Stage: seed"
    put('round',round==='Series E'?'Series D+':round,ai?'inference':'derived',ai?'AI read of their profile (social sync)':'CRM notes');
    if(r[2])put('amount',parseMoney(r[2]),'derived','CRM notes');}
  else if(yc){put('round','Pre-seed','inference','YC standard deal');}
  if(yc&&yc.date)put('date',iso(yc.date),'inference','YC batch start ('+yc.label+')');
  const d=notes.split('\n').map(x=>x.trim()).find(x=>/^[^:]{2,60}:\s.{20,}/.test(x)&&!/^(stage|booking link)/i.test(x));
  if(d)put('description',d.replace(/^[^:]+:\s*/,''),'inference','AI read of their profile (social sync)');
  return E;
}
const KW=(kinds)=>kinds.reduce((a,k)=>a+({fact:1,manual:.8,override:.8,derived:.6,inference:.4}[k]||0),0)/Math.max(1,kinds.length);

/* ---------- ICP score: 100 points, evidence only ---------- */
function score(l,cfg,now){
  cfg=cfg||ICP_DEFAULT;now=now||new Date();const W=cfg.weights;const E=evidence(l);const g=gtmOf(l);const ov=(g.icp&&g.icp.ov)||{};const sig=signals(l,now);
  const ev=k=>E[k];const val=k=>E[k]?E[k].v:null;const D={};
  // A dimension is only as strong as its weakest evidence: any inference makes it an inference, any CRM-derived value makes it derived.
  const dim=(key,pts,state,why,used)=>{const w=W[key]||0;const U2=(used||[]).filter(Boolean);const kinds=U2.map(u=>u.kind||'derived');
    D[key]={key,label:DIMS.find(x=>x[0]===key)[1],w,pts:pts==null?null:Math.max(0,Math.min(w,Math.round(pts))),state,why,
      kind:['inference','derived','manual','fact'].find(k=>kinds.includes(k))||'',src:U2.map(u=>u.src).filter(Boolean)[0]||'',kinds};};
  const U=(key,why)=>dim(key,null,'unknown',why||'Unknown',[]);
  // 1. authority
  { const t=low([val('title'),val('authority')].join(' '));const f=val('founder');
    if(f==='Yes'||/founder|ceo|chief executive/.test(t)||val('authority')==='Founder / CEO')dim('authority',W.authority,'yes','Founder / CEO: owns the growth budget',[ev('founder')||ev('title')||ev('authority')]);
    else if(val('authority')==='C-suite'||/\bc[a-z]o\b|chief|president|managing director/.test(t))dim('authority',W.authority,'yes','C-suite',[ev('title')||ev('authority')]);
    else if(val('authority')==='VP / Head of'||/\bvp\b|vice president|head of|director/.test(t))dim('authority',W.authority*.5,'partial','VP / Head of: influences, may not own the budget',[ev('title')||ev('authority')]);
    else if(has(t))dim('authority',0,'no','Not a decision-maker ('+clip(val('title')||val('authority'),40)+')',[ev('title')||ev('authority')]);
    else U('authority'); }
  // 2. industry
  { const m=val('model'),ind=low([val('industry'),val('description')].join(' '));const sw=cfg.industries.some(k=>new RegExp('\\b'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b').test(ind));
    if(m&&!cfg.models.includes(m))dim('industry',0,'no',m+' (we sell to '+cfg.models.join(' / ')+')',[ev('model')]);
    else if(m&&sw)dim('industry',W.industry,'yes',m+' '+clip(val('industry')||'software',30),[ev('model'),ev('industry')||ev('description')]);
    else if(m)dim('industry',W.industry*.4,'partial',m+', but not clearly software / AI / deep tech',[ev('model')]);
    else if(has(ind)&&sw)dim('industry',W.industry*.5,'partial','Software / AI, business model unknown',[ev('industry')||ev('description')]);
    else if(has(val('industry')))dim('industry',0,'no','Industry: '+clip(val('industry'),40),[ev('industry')]);
    else U('industry'); }
  // 3. employees
  { const n=has(val('employees'))?Number(val('employees')):null;

function pulledFrom(l,c){
  if(l){const li=(l.fields&&l.fields.li)||{},sd=String(l.source_detail||'');const src=li.src||'';
    if(src==='comp'||li.comp)return 'Competitor: '+(li.comp?li.comp+' · ':'')+(sd.replace(/\s*\(competitor\)/i,'')||'their audience');
    if(src==='postcomment')return 'A post of theirs we commented on'+(li.post_kind==='raise'?' (their raise)':li.post_kind==='hiring'?' (hiring)':'');
    if(li.warm)return 'Client: follows '+li.warm+' (our client)'+(li.list?' · '+li.list:'');
    if(src==='list')return li.list||sd.split(':')[0]||'A founder list';
    if(src==='niche')return 'Commented on '+(li.post_author||'a founder')+'’s post';

const ymOf=d=>{d=d instanceof Date?d:new Date(d);return isNaN(d)?'':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};

function ratesOf(c){
  const r=(c.rates||[]).filter(x=>x&&x.from).slice().sort((a,b)=>a.from<b.from?-1:a.from>b.from?1:0);
  const s=ymOf(c.start)||thisYm();
  if(!r.length)return [{from:s,mrr:+c.mrr||0,cost:+c.cost||0,note:'Start'}];
  if(r[0].from>s)r.unshift({from:s,mrr:+r[0].mrr||0,cost:+r[0].cost||0,note:'Start'});
  return r;
}
function rateAt(c,m){   // what they pay us (and cost us) in month m, in their own currency; null when they weren't a client then
  if(!c.start||m<ymOf(c.start))return null;
  const end=c.end?ymOf(c.end):(c.status==='Ended'?ymOf(c.updated_at||new Date()):'');
  if(end&&m>end)return null;
  if(c.status==='Paused'&&m>=(ymOf(c.paused_at)||thisYm()))return null;
  let cur=null;for(const r of ratesOf(c))if(r.from<=m)cur=r;
  return cur?{mrr:+cur.mrr||0,cost:+cur.cost||0}:null;
}
const ovIn=cur=>{const g=cliCfg();return conv(+g.overhead||0,g.overhead_cur==='USD'?'USD':'INR',cur);};
// One month of the whole business in the display currency: revenue, delivery cost, gross, overhead, tax, net
function monthBook(C,m){
  const cur=dispCur();let rev=0,cost=0,n=0;
  for(const c of C){const r=rateAt(c,m);if(!r)continue;rev+=conv(r.mrr,curOf(c),cur);cost+=conv(r.cost,curOf(c),cur);n++;}
  const gross=rev-cost,ov=n?ovIn(cur):0,pre=gross-ov,tax=Math.max(0,pre)*(+cliCfg().tax||0)/100;

  const arr=clientsAll().filter(x=>x.id!==c.id);const r=ratesOf(c);let cu=null;for(const x of r)if(x.from<=thisYm())cu=x;cu=cu||r[0];
  const next={...c,mrr:cu.mrr,cost:cu.cost,updated_at:new Date().toISOString()};

/* ---------- search (Ctrl K): people on every platform, and pages ---------- */
function searchResults(q){
  q=q.trim().toLowerCase();const out=[];
  for(const p of Object.values(PAGE))if(!q||p.label.toLowerCase().includes(q))out.push({kind:'Page',label:p.label,sub:p.grp,go:()=>nav(p.id)});
  if(q){const leads=(AK.LD.rows||[]).filter(l=>!l.archived&&[l.name,l.company,l.x_handle,l.instagram,l.email].join(' ').toLowerCase().includes(q)).slice(0,12);
    const seen=new Set(leads.map(l=>(window.GTM?GTM.normName(l.name):l.name)));
    for(const l of leads)out.push({kind:l.source||'Lead',plat:l.source,label:l.name||l.company||'(no name)',sub:[l.role,l.company].filter(Boolean).join(' · '),go:()=>L.openLead(l.id)});
    for(const c of (AK.M.contacts||[]).filter(c=>[c.Name,c.Company,c['X handle']].join(' ').toLowerCase().includes(q)).slice(0,10)){
      if(seen.has(window.GTM?GTM.normName(c.Name):c.Name))continue;out.push({kind:'X',plat:'X',label:c.Name,sub:[c.Role,c.Company].filter(Boolean).join(' · '),go:()=>L.openC(c._key)});}}
  return out.slice(0,q?20:14);
}
function openSearch(){V.pal=true;V.palQ='';V.palSel=0;drawSearch();setTimeout(()=>{const i=document.getElementById('palq');if(i)i.focus();},20);}
function closeSearch(){V.pal=false;document.getElementById('palc').innerHTML='';}
function drawSearch(onlyRes){
  const R=searchResults(V.palQ);V.palSel=Math.min(V.palSel,Math.max(0,R.length-1));
  const res=R.map((r,i)=>'<button type="button" class="r'+(i===V.palSel?' on':'')+'" data-r="'+i+'">'+(r.plat?platMark(r.plat):'<span class="plat em">↗</span>')+'<span><b>'+esc(r.label)+'</b> <span class="note">'+esc(r.sub||'')+'</span></span><span class="k">'+esc(r.kind)+'</span></button>').join('')||'<div class="empty">Nothing matches.</div>';
  const host=document.getElementById('palc');
  if(onlyRes&&host.querySelector('.res')){host.querySelector('.res').innerHTML=res;}
  else host.innerHTML='<div class="pal"><div class="box"><input id="palq" placeholder="Search people, companies, pages" autocomplete="off" value="'+esc(V.palQ)+'"><div class="res">'+res+'</div></div></div>';
  host._R=R;
}
document.addEventListener('input',e=>{if(e.target.id==='palq'){V.palQ=e.target.value;V.palSel=0;drawSearch(true);}});
document.addEventListener('click',e=>{const host=document.getElementById('palc');if(!host||!V.pal)return;
  const r=e.target.closest('#palc [data-r]');if(r){const x=host._R[+r.dataset.r];closeSearch();if(x)x.go();return;}
  if(e.target.classList.contains('pal'))closeSearch();});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();e.stopImmediatePropagation();openSearch();return;}
  if(V.pal){const host=document.getElementById('palc');const R=host._R||[];
    if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closeSearch();return;}
    if(e.key==='ArrowDown'){e.preventDefault();V.palSel=Math.min(R.length-1,V.palSel+1);drawSearch(true);}
    if(e.key==='ArrowUp'){e.preventDefault();V.palSel=Math.max(0,V.palSel-1);drawSearch(true);}
    if(e.key==='Enter'){e.preventDefault();const x=R[V.palSel];closeSearch();if(x)x.go();}
    return;}
  if(e.key==='Escape'){if(V.brief){V.brief=false;schedule();}else if(V.menu){V.menu=false;schedule();}}
},true);

if(DRY){for(const k of ['write','lbtSet','xgSet','xgDraft','xgRun','sigAct','leadSave','leadNote','leadNoteDelete','leadArchive','leadCreate','liStep','xtQueue','xtCancel','xtPause','liTips','liBrief','briefRun','liFunding','liSignal','liInmail','savePaused','lisSet','lisRun','socialRun','calSave','calNew','calUpload','movePosts','deletePost','savePosted','saveScheduled','leadSettingSave','saveTpl','importLiConnections','xRun','igRun','engagerToPipeline','saveEngager'])
  if(typeof AK[k]==='function'){const name=k;AK[k]=async(...a)=>{console.log('[dry run]',name,a);L.toast('Dry run: '+name+' (not saved)');return true;};}
  for(const k of ['save','signal','signalDel','set','touch','merge','postAdd','postSet','postPosted','intel','intelMany'])
    if(AK.gtm&&typeof AK.gtm[k]==='function'){const name='gtm.'+k;AK.gtm[k]=async(...a)=>{console.log('[dry run]',name,a);L.toast('Dry run: '+name+' (not saved)');return true;};}}

/* ---------- start ---------- */
function start(){mount();L.componentDidMount();AK.hooks.toast=(m,err)=>L.toast(m,null,err);render();}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
