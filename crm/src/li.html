<!-- LinkedIn Outreach (9 Nov): LinkedIn's daily limits next to what we did today. Spliced in by build_app.py right before
     the lead lists it sits on (gtm.html); values come from liOutVals() in logic.js (ld.liOut). -->
<sc-if value="{{ is.liOut }}">
<div style="display:flex; flex-direction:column; gap:10px; padding:var(--s-4); border-radius:var(--r-lg); background:var(--glass); border:1px solid var(--glass-edge); box-shadow:var(--shadow-sm), var(--hi); opacity:{{ E.op }}; transition:opacity 400ms var(--ease);">
<div style="display:flex; align-items:center; gap:8px;"><span style="width:18px; height:18px; border-radius:5px; display:grid; place-items:center; background:#0a66c2; color:#fff; font-size:11px; font-weight:700;">in</span><span style="font-size:var(--fs-md); font-weight:600;">LinkedIn’s limits</span><span style="font-size:var(--fs-xs); color:var(--ink-3);">Go over them and LinkedIn restricts the account for a few days.</span></div>
<div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:var(--s-3);">
<sc-for list="{{ ld.liOut.rows }}" as="r">
<div style="display:flex; flex-direction:column; gap:4px; padding:12px 14px; border-radius:var(--r-md); background:#fff; box-shadow:inset 0 0 0 1px var(--hairline);">
<span style="font-size:var(--fs-xs); color:var(--ink-3);">{{ r.label }}</span>
<span style="font-size:var(--fs-sm); font-weight:600;">{{ r.lim }}</span>
<span style="font-size:var(--fs-xs); color:var(--out-ink);">{{ r.v }}</span>
</div>
</sc-for>
</div>
<span style="font-size:var(--fs-xs); color:var(--ink-2);">{{ ld.liOut.summary }}</span>
</div>
</sc-if>
