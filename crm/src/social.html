<!-- Who engaged (7 Nov): everyone who liked or commented on our LinkedIn posts, judged against who we sell to. Spliced in by build_app.py; values come from liPeopleVals() in logic.js (lip). -->
<sc-if value="{{ is.liPeople }}">
<div style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 14px; border-radius:var(--r-md); background:var(--glass); border:1px solid var(--glass-edge); box-shadow:var(--shadow-sm), var(--hi); opacity:{{ E.op }}; transition:opacity 400ms var(--ease);">
<span style="width:8px; height:8px; border-radius:50%; background:var(--ok);"></span>
<span style="flex:1; min-width:200px; font-size:var(--fs-sm); color:{{ lip.statusFg }};">{{ lip.status }}</span>
<sc-if value="{{ lip.notRunning }}"><button onClick="{{ lip.run }}" style="height:var(--btn-h-sm); padding:0 14px; border:0; border-radius:var(--r-btn); background:var(--ink); color:#fff; font-size:var(--fs-xs); font-weight:600; cursor:pointer;" style-hover="filter:brightness(1.15);">Check now</button></sc-if>
<sc-if value="{{ lip.running }}"><span style="font-size:var(--fs-xs); color:var(--ink-3);">Checking your posts… about a minute</span></sc-if>
</div>

<div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; opacity:{{ E.op }}; transition:opacity 400ms var(--ease);">
<sc-for list="{{ lip.tabs }}" as="t"><button onClick="{{ t.go }}" style="display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 14px; border-radius:var(--r-pill); border:1px solid {{ t.bd }}; background:{{ t.bg }}; color:{{ t.fg }}; font-size:var(--fs-sm); font-weight:600; cursor:pointer; white-space:nowrap;">{{ t.label }} <span style="font-weight:700; opacity:.8;">{{ t.count }}</span></button></sc-for>
<select value="{{ lip.kind }}" onChange="{{ lip.onKind }}" aria-label="Liked or commented" style="margin-left:auto; height:32px; padding:0 10px; border:0; border-radius:var(--r-btn); background:rgba(255,255,255,.85); box-shadow:inset 0 0 0 1px var(--hairline-strong); font-size:var(--fs-sm); color:var(--ink);"><sc-for list="{{ lip.kinds }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select>
<select value="{{ lip.post }}" onChange="{{ lip.onPost }}" aria-label="Post" style="height:32px; max-width:320px; padding:0 10px; border:0; border-radius:var(--r-btn); background:rgba(255,255,255,.85); box-shadow:inset 0 0 0 1px var(--hairline-strong); font-size:var(--fs-sm); color:var(--ink);"><sc-for list="{{ lip.posts }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select>
</div>

<sc-if value="{{ lip.noCards }}"><div style="padding:var(--s-6); border-radius:var(--r-lg); background:var(--glass); border:1px solid var(--glass-edge); box-shadow:var(--shadow-md), var(--hi); font-size:var(--fs-sm); color:var(--ink-3); text-align:center;">{{ lip.emptyText }}</div></sc-if>
<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap:var(--s-3); opacity:{{ E.op }}; transform:{{ E.t }}; transition:opacity 500ms var(--ease) 60ms, transform 500ms var(--ease) 60ms;">
<sc-for list="{{ lip.cards }}" as="c">
<div style="display:flex; flex-direction:column; gap:10px; padding:var(--s-4); border-radius:var(--r-lg); background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow-sm), var(--hi);">
<div style="display:flex; align-items:flex-start; gap:10px;">
<span style="width:var(--av-sm); height:var(--av-sm); flex:0 0 var(--av-sm); border-radius:50%; display:grid; place-items:center; font-size:var(--fs-3xs); font-weight:600; background:{{ c.avBg }}; color:{{ c.avFg }};">{{ c.ini }}</span>
<div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; line-height:1.3;">
<span style="font-size:var(--fs-sm); font-weight:600;">{{ c.name }}</span>
<span style="font-size:var(--fs-2xs); color:var(--ink-3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ c.headline }}</span>
</div>
<span style="display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:var(--r-pill); font-size:var(--fs-3xs); font-weight:600; white-space:nowrap; background:{{ c.fit.bg }}; color:{{ c.fit.fg }};"><span style="width:6px; height:6px; border-radius:50%; background:{{ c.fit.dot }};"></span>{{ c.fit.label }}</span>
</div>
<sc-if value="{{ c.hasWhy }}"><span style="font-size:var(--fs-xs); color:var(--ink-2); line-height:1.45;">{{ c.why }}</span></sc-if>
<sc-if value="{{ c.hasCompany }}"><span style="font-size:var(--fs-2xs); color:var(--ink-3); line-height:1.4;">{{ c.company }}</span></sc-if>
<sc-if value="{{ c.hasSaid }}"><span style="padding:8px 10px; border-radius:8px; background:rgba(255,255,255,.7); box-shadow:inset 0 0 0 1px var(--hairline); font-size:var(--fs-xs); line-height:1.45; color:var(--ink);">“{{ c.said }}”</span></sc-if>
<span style="font-size:var(--fs-2xs); color:var(--ink-3); line-height:1.4;">{{ c.did }} · {{ c.when }}</span>
<div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding-top:8px; border-top:1px solid var(--hairline);">
<sc-if value="{{ c.notInLeads }}"><button onClick="{{ c.add }}" style="height:var(--btn-h-sm); padding:0 12px; border:0; border-radius:var(--r-btn); background:var(--out); color:#fff; font-size:var(--fs-xs); font-weight:600; cursor:pointer;" style-hover="filter:brightness(1.06);">Add to Leads</button></sc-if>
<sc-if value="{{ c.inLeads }}"><button onClick="{{ c.openLead }}" style="height:var(--btn-h-sm); padding:0 12px; border:0; border-radius:var(--r-btn); background:var(--ok-soft); color:var(--ok-ink); box-shadow:inset 0 0 0 1px var(--ok-line); font-size:var(--fs-xs); font-weight:600; cursor:pointer;">✓ {{ c.leadLabel }}</button></sc-if>
<button onClick="{{ c.profile }}" style="height:var(--btn-h-sm); padding:0 12px; border:0; border-radius:var(--r-btn); background:var(--glass-strong); box-shadow:var(--shadow-sm), var(--hi); font-size:var(--fs-xs); font-weight:500; cursor:pointer;" style-hover="background:#fff;">Profile ↗</button>
<select value="{{ c.fitVal }}" onChange="{{ c.setFit }}" aria-label="Change how good a fit they are" title="Change how good a fit they are" style="margin-left:auto; height:30px; padding:0 6px; border:0; border-radius:8px; background:transparent; box-shadow:inset 0 0 0 1px var(--hairline); font-size:var(--fs-2xs); color:var(--ink-2); cursor:pointer;"><sc-for list="{{ c.fitOpts }}" as="o"><option value="{{ o.v }}">{{ o.l }}</option></sc-for></select>
</div>
</div>
</sc-for>
</div>
<span style="font-size:var(--fs-xs); color:var(--ink-3);">{{ lip.count }}</span>
</sc-if>
