<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{width:340px;margin:0;padding:14px;font:13px/1.45 system-ui,"Segoe UI",sans-serif;color:#15171c}
  h1{font-size:14px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  h1 i{width:16px;height:16px;border-radius:4px;background:#0a66c2;color:#fff;font:700 10px/16px system-ui;text-align:center;font-style:normal}
  .sub{color:#6a707c;font-size:12px;margin-bottom:10px}
  .row{display:flex;gap:8px;margin:8px 0}
  .card{background:#f6f5f2;border-radius:8px;padding:8px 10px;margin:8px 0}
  .card b{font-weight:600}
  button{flex:1;height:32px;border:1px solid #15171c;background:#fff;border-radius:6px;font:500 13px system-ui;cursor:pointer}
  button.solid{background:#0a66c2;border-color:#0a66c2;color:#fff}
  input{flex:1;height:30px;border:1px solid #d3d1cb;border-radius:6px;padding:0 8px;font:13px system-ui}
  ul{list-style:none;margin:0;padding:0;max-height:200px;overflow:auto;font-size:12px}
  li{padding:4px 0;border-bottom:1px solid #eee}
  li.err{color:#b33a00}
  li small{color:#9a9fa8;margin-right:6px}
  .hide{display:none}
</style></head>
<body>
  <h1><i>in</i>SOVE7GN LinkedIn Bot</h1>
  <div class="sub">Requests, DMs and follow-ups to ICP people who engaged with our posts. Keep Chrome open and it runs on its own.</div>

  <div id="setup" class="card hide">
    <b>Step 1: paste the bot key</b>
    <div class="sub" style="margin:4px 0 0">It's in the file _research/LI_BOT_KEY.txt on your laptop.</div>
    <div class="row"><input id="key" type="password" placeholder="Bot key"><button id="save" class="solid" style="flex:0 0 70px">Save</button></div>
  </div>

  <div id="status" class="card">Checking…</div>
  <div class="row"><button id="run" class="solid">Run now</button><button id="test">Test LinkedIn</button></div>
  <div id="test-out" class="card hide"></div>
  <ul id="logs"></ul>
  <div class="row"><button id="crm">Open Outreach in the CRM</button></div>
  <div class="sub" style="margin-top:6px"><a href="#" id="rekey">Change bot key</a></div>
<script src="popup.js"></script>
</body></html>
